<svg width="1200" height="340" viewBox="0 0 1200 340" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Pedro Felipe — Backend Developer</title>
  <desc id="desc">Obsidian-themed banner in black, graphite, steel blue and copper.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050607"/>
      <stop offset="0.56" stop-color="#0A0D10"/>
      <stop offset="1" stop-color="#11171B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(965 112) rotate(139) scale(390 310)">
      <stop stop-color="#6E9EAD" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#6E9EAD" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" stroke="#E6EDF3" stroke-opacity="0.035"/>
    </pattern>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      @keyframes blink { 0%, 45% { opacity: 1; } 46%, 100% { opacity: .14; } }
      @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
      .cursor { animation: blink 1.2s steps(1) infinite; }
      .pulse { animation: pulse 2.8s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) { .cursor, .pulse { animation: none; } }
    </style>
  </defs>

  <rect width="1200" height="340" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="24" fill="url(#glow)"/>
  <rect width="1200" height="340" rx="24" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="338" rx="23" stroke="#30363D" stroke-width="2"/>

  <g opacity="0.75">
    <circle cx="1012" cy="170" r="112" stroke="#6E9EAD" stroke-opacity="0.16"/>
    <circle cx="1012" cy="170" r="82" stroke="#6E9EAD" stroke-opacity="0.12"/>
    <path d="M867 170H1156M1012 25V315" stroke="#6E9EAD" stroke-opacity="0.10"/>
    <path d="M922 80L1102 260M1102 80L922 260" stroke="#E6EDF3" stroke-opacity="0.045"/>
    <circle class="pulse" cx="1124" cy="170" r="4" fill="#6E9EAD" filter="url(#softGlow)"/>
    <circle cx="900" cy="170" r="3" fill="#B8755E"/>
  </g>

  <g class="mono" font-size="13" letter-spacing="1.8">
    <rect x="64" y="46" width="228" height="34" rx="17" fill="#10161A" stroke="#2A343A"/>
    <circle cx="84" cy="63" r="4" fill="#6E9EAD"/>
    <text x="98" y="68" fill="#9DA7AE">FORTALEZA · CE · BR</text>
  </g>

  <text x="64" y="157" class="sans" font-size="68" font-weight="750" letter-spacing="-2" fill="#E6EDF3">PEDRO FELIPE</text>
  <rect class="cursor" x="535" y="111" width="7" height="52" rx="2" fill="#6E9EAD"/>
  <text x="67" y="202" class="mono" font-size="19" letter-spacing="4" fill="#8F9AA2">BACKEND DEVELOPER · COMPUTER SCIENCE</text>
  <path d="M67 226H655" stroke="#30363D"/>
  <text x="67" y="260" class="mono" font-size="15" letter-spacing="2" fill="#6E9EAD">JAVA / SPRING BOOT / APIs / SYSTEM INTEGRATION</text>
  <text x="67" y="296" class="mono" font-size="12" letter-spacing="2.3" fill="#B8755E">COMPUTER SCIENCE @ UNIFOR</text>

  <g class="mono" text-anchor="middle">
    <text x="1012" y="192" font-size="82" font-weight="700" letter-spacing="-7" fill="#E6EDF3" fill-opacity="0.9">PF</text>
    <text x="1012" y="229" font-size="11" letter-spacing="4" fill="#6E9EAD">PDRFLP</text>
  </g>

  <g fill="#30363D">
    <circle cx="28" cy="28" r="3"/><circle cx="1172" cy="28" r="3"/>
    <circle cx="28" cy="312" r="3"/><circle cx="1172" cy="312" r="3"/>
  </g>
</svg>
