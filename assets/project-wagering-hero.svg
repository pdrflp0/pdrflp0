<svg width="1200" height="272" viewBox="0 0 1200 272" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Distributed Wagering Processor</title>
  <desc id="desc">Distributed financial transaction processor built for the Jungle Gaming backend challenge — NestJS, Bun, PostgreSQL, AWS SQS.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1200" y2="272"><stop stop-color="#070809"/><stop offset="1" stop-color="#11171B"/></linearGradient></defs>
  <rect x="1" y="1" width="1198" height="270" rx="20" fill="url(#bg)" stroke="#30363D" stroke-width="2"/>

  <text x="40" y="42" fill="#6E9EAD" font-family="ui-monospace,monospace" font-size="12" letter-spacing="2">FEATURED / DISTRIBUTED SYSTEMS</text>
  <text x="40" y="88" fill="#E6EDF3" font-family="ui-sans-serif,system-ui,sans-serif" font-size="32" font-weight="700">Distributed Wagering Processor</text>
  <text x="40" y="116" fill="#8F9AA2" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15">Financial transaction engine with persistent idempotency, pessimistic concurrency control and</text>
  <text x="40" y="138" fill="#8F9AA2" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15">event-driven architecture — technical challenge for Jungle Gaming (iGaming).</text>

  <g font-family="ui-monospace,monospace" font-size="12" fill="#B8C1C7">
    <rect x="40" y="160" width="82" height="30" rx="15" fill="#141A1E" stroke="#29333A"/><text x="81" y="180" text-anchor="middle">NESTJS</text>
    <rect x="130" y="160" width="100" height="30" rx="15" fill="#141A1E" stroke="#29333A"/><text x="180" y="180" text-anchor="middle">TYPESCRIPT</text>
    <rect x="238" y="160" width="60" height="30" rx="15" fill="#141A1E" stroke="#29333A"/><text x="268" y="180" text-anchor="middle">BUN</text>
    <rect x="306" y="160" width="104" height="30" rx="15" fill="#141A1E" stroke="#29333A"/><text x="358" y="180" text-anchor="middle">POSTGRESQL</text>
    <rect x="418" y="160" width="98" height="30" rx="15" fill="#141A1E" stroke="#29333A"/><text x="467" y="180" text-anchor="middle">AWS SQS</text>
    <rect x="524" y="160" width="76" height="30" rx="15" fill="#141A1E" stroke="#29333A"/><text x="562" y="180" text-anchor="middle">DOCKER</text>
  </g>

  <g font-family="ui-monospace,monospace" font-size="12">
    <rect x="40" y="204" width="128" height="30" rx="15" fill="#161010" stroke="#3A2A26"/>
    <text x="58" y="224" fill="#B8755E" font-weight="700">13.9K</text><text x="98" y="224" fill="#8F9AA2">LOC</text>
    <rect x="176" y="204" width="118" height="30" rx="15" fill="#161010" stroke="#3A2A26"/>
    <text x="194" y="224" fill="#B8755E" font-weight="700">297</text><text x="222" y="224" fill="#8F9AA2">TESTS</text>
    <rect x="302" y="204" width="160" height="30" rx="15" fill="#161010" stroke="#3A2A26"/>
    <text x="320" y="224" fill="#B8755E" font-weight="700">6</text><text x="334" y="224" fill="#8F9AA2">MIGRATIONS</text>
  </g>

  <g stroke="#6E9EAD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <circle cx="1030" cy="136" r="14"/>
    <circle cx="950" cy="90" r="10"/>
    <circle cx="950" cy="182" r="10"/>
    <circle cx="1110" cy="90" r="10"/>
    <circle cx="1110" cy="182" r="10"/>
    <path d="M1018 126L958 96M1018 146L958 176M1042 126L1102 96M1042 146L1102 176"/>
    <path d="M950 90L1110 90M950 182L1110 182" stroke-dasharray="2 6" opacity="0.6"/>
    <circle cx="1030" cy="136" r="4" fill="#B8755E" stroke="none"/>
  </g>
