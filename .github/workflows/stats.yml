name: player stats

# Regera assets/stats.svg e assets/stats-pt.svg com os números do dia.
on:
  schedule:
    - cron: "0 9 * * *" # 06:00 em Fortaleza
  workflow_dispatch:

permissions:
  contents: write

concurrency: stats

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/package-lock.json
      - name: fontes e dependências
        working-directory: scripts
        run: npm ci && npm run fonts
      - name: gera o placar
        working-directory: scripts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run stats
      - name: publica se mudou
        run: |
          git diff --quiet -- assets/ && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/stats-pt.svg
          git commit -m "chore: placar do jogador do dia"
          git push
